name: Deploy the proxy worker

on:
  push:
    branches: [main]
    paths: [proxy/**, src/shared/proxied.ts, .github/workflows/proxy.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Wrangler directly rather than cloudflare/wrangler-action, which runs on the deprecated Node
      # 20 and installs an outdated Wrangler. The token is a repository secret from the "Edit
      # Cloudflare Workers" template; the account id is not a secret and sits in wrangler.toml.
      - run: npx -y wrangler@4 deploy
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
